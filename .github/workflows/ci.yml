name: AI CITY Production Hardening & CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: Static Security Analysis & Secret Scanning (OWASP A08 / A09)
  # ============================================================================
  security-audit:
    name: Secret Scanning & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend High-Severity Dependency Audit
        working-directory: backend
        run: npm audit --audit-level=high || true

      - name: Frontend High-Severity Dependency Audit
        working-directory: frontend
        run: npm audit --audit-level=high || true

  # ============================================================================
  # Job 2: Backend Quality Gate (Types, Linting, 40-Scenario Vitest, Build)
  # ============================================================================
  backend-verify:
    name: Backend Verification (Node.js 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps

      - name: TypeScript Static Typecheck (App + Tests)
        working-directory: backend
        run: |
          npx tsc --noEmit -p tsconfig.json
          npx tsc --noEmit -p tsconfig.test.json

      - name: ESLint Verification
        working-directory: backend
        run: npm run lint

      - name: Run Vitest Suite (Unit, API, Security, Integration, Performance)
        working-directory: backend
        env:
          NODE_ENV: test
          ENABLE_DEV_AUTH: "true"
          ALLOW_HTTP_FOR_LOCAL_TESTING: "true"
        run: npm run test:coverage

      - name: Production TypeScript Build
        working-directory: backend
        run: npm run build

  # ============================================================================
  # Job 3: Frontend Quality Gate (Types, Linting, Tests, CWV Bundle Budget)
  # ============================================================================
  frontend-verify:
    name: Frontend Verification (Vite 5 / React 18)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Static Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Vitest Unit & Client Verification
        working-directory: frontend
        run: npm test

      - name: Production Vite Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
        run: npm run build

      - name: Assert Core Web Vitals Entry Bundle Budget (< 250 kB raw)
        working-directory: frontend
        run: |
          ENTRY_CHUNK=$(ls -S dist/assets/index-*.js | head -n 1)
          CHUNK_SIZE_BYTES=$(stat -c%s "$ENTRY_CHUNK")
          CHUNK_SIZE_KB=$((CHUNK_SIZE_BYTES / 1024))
          echo "Initial Entry Chunk ($ENTRY_CHUNK) Size: ${CHUNK_SIZE_KB} kB"
          if [ "$CHUNK_SIZE_KB" -gt 250 ]; then
            echo "ERROR: Entry bundle exceeded 250 kB limit! Current: ${CHUNK_SIZE_KB} kB"
            exit 1
          fi
          echo "SUCCESS: Entry bundle is strictly within performance budget (< 250 kB)."

  # ============================================================================
  # Job 4: Container Build & Docker Compose Verification
  # ============================================================================
  docker-verify:
    name: Container Build & Compose Validation
    runs-on: ubuntu-latest
    needs: [backend-verify, frontend-verify]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Dry-Run Build Backend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: aicity-backend:ci-test

      - name: Dry-Run Build Frontend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=/api
          push: false
          tags: aicity-frontend:ci-test
