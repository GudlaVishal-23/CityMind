services:
  # ==============================================================================
  # 1. MongoDB with Single-Node Replica Set (rs0) for ACID Transactions
  # ==============================================================================
  mongodb:
    image: mongo:7
    container_name: aicity-mongodb
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: aicity
    volumes:
      - mongo_data:/data/db
    networks:
      - aicity-net
    healthcheck:
      test: >
        mongosh --quiet --eval '
          try {
            const status = rs.status();
            if (status.ok === 1) quit(0);
          } catch (e) {
            const init = rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] });
            if (init.ok === 1 || init.codeName === "AlreadyInitialized") quit(0);
          }
          quit(1);
        '
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ==============================================================================
  # 2. Neo4j Graph Database
  # ==============================================================================
  neo4j:
    image: neo4j:5-community
    container_name: aicity-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-aicity_dev_pass}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_pagecache_size: "256M"
      NEO4J_dbms_memory_heap_initial__size: "256M"
      NEO4J_dbms_memory_heap_max__size: "512M"
    volumes:
      - neo4j_data:/data
    networks:
      - aicity-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==============================================================================
  # 3. Hardened Express Backend Service
  # ==============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicity-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      ENABLE_DEV_AUTH: "false"
      MONGODB_URI: "mongodb://mongodb:27017/aicity?replicaSet=rs0&directConnection=true"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-aicity_dev_pass}"
      CORS_ALLOWED_ORIGINS: "http://localhost:8080,http://frontend:8080"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL_NAME: "${GEMINI_MODEL_NAME:-gemini-2.0-flash}"
      CLOUDINARY_URL: "${CLOUDINARY_URL:-}"
    depends_on:
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - aicity-net

  # ==============================================================================
  # 4. Hardened Nginx Frontend Client & Reverse Proxy
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: aicity-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aicity-net

# ==============================================================================
# Persistent Named Storage Volumes
# ==============================================================================
volumes:
  mongo_data:
    driver: local
  neo4j_data:
    driver: local

# ==============================================================================
# Isolated Bridge Network
# ==============================================================================
networks:
  aicity-net:
    driver: bridge
